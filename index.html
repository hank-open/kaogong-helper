<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#F6C9D3" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>考公助手</title>
<link rel="stylesheet" href="css/base.css" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/pages.css" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="考公助手" />
<link rel="apple-touch-icon" href="favicon.svg" />
<script>
  (function(){
    try{
      var s=JSON.parse(localStorage.getItem('gk_workbench_state_v1')||'{}');
      var cfg=s.settings||{};
      var el=document.documentElement;
      if(cfg.darkMode)el.setAttribute('data-dark','1');
      if(cfg.accent&&cfg.accent!=='blue')el.setAttribute('data-accent',cfg.accent);
    }catch(e){}
  })();
</script>
</head>
<body>
  <div class="app-bg"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

  <div id="app">
    <main id="view" class="view"></main>
    <nav id="tabbar" class="tabbar"></nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/media.js"></script>
  <script src="js/asr.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/widgets.js"></script>
  <script src="js/qrcode.min.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/modules.js"></script>
  <script src="js/pages/mistakes.js"></script>
  <script src="js/pages/review.js"></script>
  <script src="js/pages/checkin.js"></script>
  <script src="js/pages/papers.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
